<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Virtual — Iniciar sesión</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#14231C;color:#F6F1E4;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:24px}main{width:100%;max-width:440px}h1{text-align:center;font-size:32px}h1 span{color:#E3A23B}.panel{padding:28px;background:#1E3B2A;border:1px solid #ffffff29;border-radius:12px}h2{margin-top:0}p{color:#dfdfd2;line-height:1.5}label{display:block;margin:16px 0 6px}input,button{font:inherit;width:100%;padding:12px;border-radius:6px}input{background:#14231C;border:1px solid #ffffff55;color:#F6F1E4}button{margin-top:18px;border:0;background:#E3A23B;color:#14231C;font-weight:600;cursor:pointer}button.secondary{background:transparent;color:#F6F1E4;border:1px solid #ffffff55}button:disabled{opacity:.6;cursor:wait}[hidden]{display:none!important}#mensaje{white-space:pre-line}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #E3A23B;outline-offset:3px}
</style>
<script src="/login.js" defer></script>
</head>
<body>
<main>
<h1>BINGO VIRTUAL<span>.</span></h1>
<div class="panel">
<form id="login">
<h2>Iniciar sesión</h2>
<p>Ingresá con tu cuenta para acceder a tu panel.</p>
<label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required>
<button type="submit">Ingresar</button>
<button class="secondary" id="crearCuenta" type="button">Crear cuenta de organizador</button>
</form>
<form id="registro" hidden>
<h2>Crear cuenta de organizador</h2>
<p>Tu cuenta deberá ser aprobada por el administrador para crear sorteos.</p>
<label for="nombre">Nombre / organización</label><input id="nombre" autocomplete="organization" minlength="2" required>
<label for="registroEmail">Email</label><input id="registroEmail" type="email" autocomplete="username" required>
<label for="registroPassword">Contraseña (mínimo 8 caracteres)</label><input id="registroPassword" type="password" autocomplete="new-password" minlength="8" required>
<label for="repetirPassword">Repetir contraseña</label><input id="repetirPassword" type="password" autocomplete="new-password" minlength="8" required>
<button type="button" class="secondary" id="mostrarPassword" aria-pressed="false">Mostrar contraseñas</button>
<button type="submit">Crear cuenta</button>
<button class="secondary" id="volver" type="button">Volver a ingresar</button>
</form>
<p id="mensaje" role="status" aria-live="polite"></p>
</div>
</main>
</body>
</html>
