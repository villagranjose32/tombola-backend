<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{ margin:0; min-height:100vh; background:#14231C; color:#F6F1E4; font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; }
  .wrap{ text-align:center; padding:40px; }
  h1{ font-family:'Anton',sans-serif; font-weight:400; font-size:38px; letter-spacing:0.5px; margin:0 0 6px; }
  h1 span{ color:#E3A23B; }
  p{ color:rgba(246,241,228,0.6); margin-bottom:32px; }
  .links{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  a.card{
    display:block; width:220px; padding:24px; background:#1E3B2A; border:1px solid rgba(246,241,228,0.16);
    border-radius:8px; color:#F6F1E4; text-decoration:none; transition:transform .15s;
  }
  a.card:hover{ transform:translateY(-3px); border-color:#E3A23B; }
  a.card .tag{ font-family:'Inter',monospace; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#E3A23B; margin-bottom:8px; }
  a.card .name{ font-size:16px; font-weight:600; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>BINGO VIRTUAL<span>.</span></h1>
    <p>Elegí el acceso correspondiente para administrar o gestionar tus sorteos.</p>
    <div class="links">
      <a class="card" href="/admin.html"><div class="tag">Acceso privado</div><div class="name">Administración</div></a>
      <a class="card" href="/organizador.html"><div class="tag">Acceso privado</div><div class="name">Panel de organizadores</div></a>
      <a class="card" href="/sorteo-en-vivo.html"><div class="tag">bolillero</div><div class="name">Sorteo en vivo</div></a>
    </div>
  </div>
</body>
</html>
